<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tienda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Aviso de mayores de 18 -->
<div class="gate" id="gate" role="dialog" aria-modal="true" aria-labelledby="gate-t" hidden>
  <div class="gate-box">
    <p class="mono">&gt; verificación</p>
    <h2 id="gate-t">Sitio para mayores de 18 años</h2>
    <p>Para entrar tenés que ser mayor de edad.</p>
    <div class="gate-btns">
      <button type="button" class="btn btn-main" id="gate-yes">Soy mayor de 18</button>
      <button type="button" class="btn btn-line" id="gate-no">Salir</button>
    </div>
  </div>
</div>

<div class="aviso" id="aviso"></div>

<header class="top">
  <div class="wrap top-in">
    <a class="brand" href="#" id="brand"></a>
    <button class="cart-btn" id="open-cart" type="button">Carrito <span id="count">0</span></button>
  </div>
</header>

<section class="hero">
  <div class="wrap hero-in">
    <div class="hero-text">
      <p class="mono" id="h-kicker"></p>
      <h1 id="h-title"></h1>
      <p class="sub" id="h-sub"></p>
      <a class="btn btn-main" href="#catalogo">Ver catálogo</a>
    </div>
    <div class="hero-art" id="h-art"></div>
  </div>
</section>

<main class="wrap" id="catalogo">
  <div class="filters" id="filters"></div>
  <div class="grid" id="grid"></div>
</main>

<footer class="wrap foot" id="foot"></footer>

<!-- Ficha de producto -->
<dialog id="pdp" aria-label="Producto">
  <button type="button" class="x" data-close aria-label="Cerrar">✕</button>
  <div class="pdp-grid">
    <div class="pdp-media">
      <div class="pdp-img" id="pdp-img"></div>
      <div class="thumbs" id="pdp-thumbs"></div>
    </div>
    <div class="pdp-info">
      <h2 id="pdp-name"></h2>
      <p class="pdp-price" id="pdp-price"></p>
      <p class="pdp-desc" id="pdp-desc"></p>
      <div id="pdp-vars"></div>
      <p class="err" id="pdp-err" role="alert"></p>
      <button type="button" class="btn btn-main" id="pdp-add">Agregar al carrito</button>
    </div>
  </div>
</dialog>

<!-- Carrito -->
<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer" role="dialog" aria-label="Tu carrito" aria-hidden="true">
  <div class="drawer-head">
    <h2>Tu carrito</h2>
    <button type="button" class="close" id="close-cart" aria-label="Cerrar">✕</button>
  </div>
  <div class="drawer-body">
    <div id="lines"></div>
    <div id="checkout" hidden>
      <label>Tu nombre<input id="f-name" autocomplete="name"></label>
      <fieldset>
        <legend>Cómo lo querés</legend>
        <label class="radio"><input type="radio" name="mode" value="retiro" checked> Retiro en el local</label>
        <label class="radio"><input type="radio" name="mode" value="envio"> Envío a domicilio</label>
      </fieldset>
      <label id="addr-wrap" hidden>Dirección de entrega<input id="f-addr" autocomplete="street-address"></label>
      <label>Aclaraciones (opcional)<textarea id="f-note" rows="2"></textarea></label>
    </div>
  </div>
  <div class="drawer-foot">
    <div class="totals" id="totals"></div>
    <p class="err" id="err" role="alert"></p>
    <button type="button" class="btn btn-main" id="send" disabled>Enviar pedido por WhatsApp</button>
  </div>
</aside>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
  </html>
