<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tienda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Hanken+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="aviso" id="aviso"></div>

<header class="top">
  <div class="wrap top-in">
    <a class="brand" href="#" id="brand"></a>
    <button class="cart-btn" id="open-cart" type="button">Bolsa <span id="count">0</span></button>
  </div>
</header>

<section class="hero" id="hero">
  <div class="wrap hero-in">
    <div class="hero-text">
      <h1 id="h-title" class="hero-title"></h1>
      <p id="h-sub"></p>
      <a class="btn btn-light" href="#coleccion">Ver colección</a>
    </div>
    <div class="hero-media">
      <img id="h-img" src="" alt="Nueva colección">
    </div>
  </div>
</section>

<main class="wrap" id="coleccion">
  <div class="filters" id="filters"></div>
  <div class="grid" id="grid"></div>
</main>

<footer class="wrap foot" id="foot"></footer>

<!-- Ficha de producto -->
<dialog id="pdp" aria-label="Producto">
  <button type="button" class="x" data-close aria-label="Cerrar">✕</button>
  <div class="pdp-grid">
    <div class="pdp-img">
      <img id="pdp-img-el" src="" alt="">
    </div>
    <div class="pdp-info">
      <h2 id="pdp-name"></h2>
      <p class="pdp-price" id="pdp-price"></p>
      <p class="pdp-desc" id="pdp-desc"></p>
      <div id="pdp-sizes"></div>
      <div id="pdp-colors"></div>
      <p class="err" id="pdp-err" role="alert"></p>
      <button type="button" class="btn btn-main" id="pdp-add">Agregar a la bolsa</button>
    </div>
  </div>
</dialog>

<!-- Bolsa -->
<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer" role="dialog" aria-label="Tu bolsa" aria-hidden="true">
  <div class="drawer-head">
    <h2>Tu bolsa</h2>
    <button type="button" class="close" id="close-cart" aria-label="Cerrar">✕</button>
  </div>
  <div class="drawer-body">
    <div id="lines"></div>
    <div id="checkout" hidden>
      <label>Tu nombre<input id="f-name" autocomplete="name"></label>
      <fieldset>
        <legend>Cómo lo querés</legend>
        <label class="radio"><input type="radio" name="mode" value="retiro" checked> Retiro en el local</label>
        <label class="radio"><input type="radio" name="mode" value="envio"> Envío a domicilio</label>
      </fieldset>
      <label id="addr-wrap" hidden>Dirección de entrega<input id="f-addr" autocomplete="street-address"></label>
      <label>Aclaraciones (opcional)<textarea id="f-note" rows="2"></textarea></label>
    </div>
  </div>
  <div class="drawer-foot">
    <div class="totals" id="totals"></div>
    <p class="err" id="err" role="alert"></p>
    <button type="button" class="btn btn-main" id="send" disabled>Enviar pedido por WhatsApp</button>
  </div>
</aside>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
